[versions]
agp = "9.4.1"
# Match AGP's built-in Kotlin; no separate Android Kotlin plugin.
kotlin = "2.2.10"
# SDK 35-compatible stable BOM; newer BOMs require SDK 36/37.
compose = "2025.04.01"
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.10.2" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
junit = { module = "junit:junit", version = "4.13.2" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
